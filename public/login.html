<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — AI × Gaming Intelligence</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --text:#e7eaf0; --muted:#9aa3b2; --accent:#6ea8fe; --border:#262b36; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 360px; max-width: 92vw; background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    label { display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type=email] {
      width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: #0f1218; color: var(--text); font-size: 14px; outline: none;
    }
    input[type=email]:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 14px; padding: 11px 12px; border-radius: 9px; border: 0;
      background: var(--accent); color: #07101f; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg.ok { color: #7ee0a6; }
    .msg.err { color: #ff8a8a; }
    .note { margin-top: 16px; font-size: 11px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">AI × Gaming competitive intelligence</p>
    <form id="form">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@company.com" required />
      <button id="submit" type="submit">Send magic link</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="note">
      We'll email you a one-time sign-in link. Access is restricted to approved
      addresses — if you don't receive a link, contact the workspace owner.
    </div>
  </div>
  <script>
    const form = document.getElementById("form");
    const emailEl = document.getElementById("email");
    const submit = document.getElementById("submit");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = ""; msg.className = "msg";
      const email = emailEl.value.trim();
      if (!email) return;
      submit.disabled = true; submit.textContent = "Sending…";
      try {
        const r = await fetch("/api/auth/magic-link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          msg.className = "msg ok";
          msg.textContent = data.sent
            ? "Check your email for a sign-in link."
            : "If that address is approved, a link is on its way.";
          submit.textContent = "Resend link";
        } else {
          msg.className = "msg err";
          msg.textContent = data.error || "Could not send the link. Try again.";
          submit.textContent = "Send magic link";
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Network error. Try again.";
        submit.textContent = "Send magic link";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
